name: Proofrail live Pages smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for Proofrail homepage and preserved workbench
        shell: bash
        run: |
          set -euo pipefail
          url="https://ledgertrace.pages.dev/"
          html=""
          for attempt in $(seq 1 30); do
            if html="$(curl --connect-timeout 3 --max-time 5 -fsSL "$url" 2>/dev/null)"; then
              if [[ "$html" == *"Blocked invoices need"* &&
                    "$html" == *"Accounts Payable Exception Intelligence"* &&
                    "$html" == *"Parked Invoice & Three-Way Match Evidence Review"* &&
                    "$html" == *"SYNTHETIC RECORDS / INTERACTIVE"* ]]; then
                break
              fi
            fi
            html=""
            echo "Waiting for production deployment (attempt $attempt/30)."
            sleep 5
          done
          test -n "$html" || { echo "::error::Proofrail homepage did not deploy."; exit 1; }
          [[ "$html" != *"duplicate supplier payments, missed supplier credits"* ]] || { echo "::error::Unsupported recovery claim remains in homepage metadata."; exit 1; }
          workbench="$(curl --connect-timeout 10 --max-time 20 -fsSL 'https://ledgertrace.pages.dev/workbench.html')"
          [[ "$workbench" == *"AP Exception Evidence Workbench"* ]]
          [[ "$workbench" == *"recovery-core.js"* ]]
          [[ "$workbench" == *"proofrail-theme.css"* || "$workbench" == *"caseweft-theme.css"* ]]
          echo "Homepage and preserved workbench are reachable."

      - name: Verify brand mark, workbench theme and product engine
        shell: bash
        run: |
          set -euo pipefail
          mark="$(curl --connect-timeout 10 --max-time 20 -fsSL 'https://ledgertrace.pages.dev/assets/caseweft-monogram.svg')"
          [[ "$mark" == *"Proofrail mark"* ]]
          theme="$(curl --connect-timeout 10 --max-time 20 -fsSL 'https://ledgertrace.pages.dev/assets/caseweft-theme.css')"
          [[ "$theme" == *"--lt-navy:#142F32"* ]]
          [[ "$theme" == *"--lt-blue:#2E7774"* ]]
          core="$(curl --connect-timeout 10 --max-time 20 -fsSL 'https://ledgertrace.pages.dev/recovery-core.js')"
          [[ "$core" == *"paymentExcessCandidate"* ]]
          [[ "$core" == *"currencyUnresolved"* ]]
          echo "Brand asset, shared theme and recovery engine are reachable."

      - name: Verify current sitemap excludes retired claims
        shell: bash
        run: |
          set -euo pipefail
          sitemap="$(curl --connect-timeout 10 --max-time 20 -fsSL 'https://ledgertrace.pages.dev/sitemap.xml')"
          [[ "$sitemap" == *"https://ledgertrace.pages.dev/workbench.html"* ]]
          [[ "$sitemap" != *"supplier-statement-reconciliation.html"* ]]
          [[ "$sitemap" != *"duplicate-supplier-payment-investigation.html"* ]]
          echo "Sitemap lists the current product and workbench only."

      - name: Verify inquiry API health and origin protection
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/inquiry-health.json -w '%{http_code}' 'https://ledgertrace.pages.dev/api/inquiries' || true)"
          [[ "$status" == "200" ]] || { cat /tmp/inquiry-health.json; echo "::error::Inquiry API health route unavailable."; exit 1; }
          grep -Eq '"inboxConfigured":(true|false)' /tmp/inquiry-health.json
          status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/inquiry-response.json -w '%{http_code}' -X POST 'https://ledgertrace.pages.dev/api/inquiries' -H 'Origin: https://untrusted.example' -H 'Content-Type: application/json' --data '{}')"
          [[ "$status" == "403" ]] || { cat /tmp/inquiry-response.json; echo "::error::Cross-origin request was not rejected."; exit 1; }
          echo "Inquiry API is reachable and rejects cross-origin submissions."
