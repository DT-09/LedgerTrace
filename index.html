/* LedgerTrace dark system — graphite, deep blue-steel, muted teal. */
:root{
 color-scheme:dark;
 --bg:#10151B; --panel:#171F27; --panel2:#1D2932; --line:#2B3943; --line2:#40515B;
 --text:#E7ECEE; --muted:#9AA8AE; --blue:#79B8B0; --amber:#C6A36A; --green:#8EB9A0; --red:#D38C85;
 --mono:"IBM Plex Mono",monospace; --display:"Space Grotesk",sans-serif; --body:"Inter",sans-serif;
 background:var(--bg);color:var(--text)
}
html,body{background:#10151B!important;color:#E7ECEE!important}
body:before{background-image:linear-gradient(rgba(132,158,169,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(132,158,169,.025) 1px,transparent 1px)!important;background-size:72px 72px!important;mask-image:linear-gradient(to bottom,black,transparent 76%)!important}
body:after{display:none!important}
::selection{background:rgba(121,184,176,.28)!important;color:#F4F7F7!important}
.header,.header.scrolled{background:rgba(16,21,27,.94)!important;border-color:#2B3943!important;box-shadow:0 10px 34px rgba(0,0,0,.2)!important;backdrop-filter:blur(18px)!important}
.brand-mark{background:#17232A!important;border:1px solid #40515B!important;border-radius:7px!important;color:#E7ECEE!important}
.brand-mark svg{inset:2px!important;width:calc(100% - 4px)!important;height:calc(100% - 4px)!important}
.brand-mark .mark-trace,.footer-brand .mark-trace{stroke:#79B8B0!important;stroke-width:1.8!important;stroke-dasharray:none!important;stroke-dashoffset:0!important}
.brand-mark .mark-letter{stroke:#E7ECEE!important}
.brand-name{color:#E7ECEE!important;letter-spacing:.14em!important}
.nav a{color:#A8B5BB!important}.nav a:hover{color:#E7ECEE!important}
.header-cta,.button{background:#79B8B0!important;border-color:#79B8B0!important;color:#10201F!important}
.header-cta:hover,.button:hover{background:#91C9C1!important;border-color:#91C9C1!important;color:#10201F!important}
.button.secondary{background:#171F27!important;border-color:#40515B!important;color:#E7ECEE!important}
.button.secondary:hover{background:#1D2932!important;border-color:#79B8B0!important}
.button.ghost{color:#9AA8AE!important}.button.ghost:hover{background:#1D2932!important;color:#E7ECEE!important}
.menu-toggle{border-color:#40515B!important;color:#E7ECEE!important}
.eyebrow,.section-index{color:#79B8B0!important}
.trace-rule{background:linear-gradient(90deg,#79B8B0,rgba(121,184,176,.12) 70%,transparent)!important}
.trace-rule:before{background:#79B8B0!important;box-shadow:0 0 10px rgba(121,184,176,.22)!important}
h1,h2,h3{color:#E7ECEE}
h1 em{color:#79B8B0!important}
.hero-desc{color:#B2BEC3!important}
.privacy-note{color:#9AA8AE!important}.privacy-note:before{background:#8EB9A0!important;box-shadow:none!important}
.scene-grid{background-image:linear-gradient(rgba(121,184,176,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(121,184,176,.065) 1px,transparent 1px)!important}
.scene-glow{display:none!important}
.scene-path{stroke:rgba(121,184,176,.52)!important}.scene-path.broken{stroke:#C6A36A!important}
.scene-node{fill:#10151B!important;stroke:#79B8B0!important}.scene-node.warn{stroke:#C6A36A!important}
.document{background:linear-gradient(145deg,#1B252D,#151D24)!important;border-color:#34434D!important;box-shadow:0 20px 50px rgba(0,0,0,.25)!important;backdrop-filter:none!important}
.document:hover{border-color:#79B8B0!important;box-shadow:0 0 0 1px rgba(121,184,176,.07),0 20px 50px rgba(0,0,0,.28)!important}
.doc-symbol{border-color:#40515B!important;color:#79B8B0!important}
.doc-top,.doc-sub,.scene-label,.scene-coord{color:#9AA8AE!important}
.doc-line{background:#2B3943!important}.doc-data b{color:#E7ECEE!important}
.doc-status{color:#8EB9A0!important}.doc-status.warn{color:#C6A36A!important}
.section{background:transparent!important}
.section-title{color:#E7ECEE!important}.section-lead{color:#9AA8AE!important}
.signal-strip,.signal+.signal{border-color:#2B3943!important}
.signal strong{color:#E7ECEE!important}.signal span{color:#9AA8AE!important}

.cell-main{color:#E7ECEE!important}.cell-sub,.table-note{color:#9AA8AE!important}

.boundary strong{color:#E7ECEE!important}.boundary p{color:#9AA8AE!important}
.evaluation{background:linear-gradient(180deg,#121920,#10151B)!important}

footer,.footer,.site-footer{background:#0C1116!important;color:#E7ECEE!important;border-color:#26343D!important}
footer a,.footer a,.footer-brand .brand-name{color:#E7ECEE!important}
footer p,footer .muted,footer .small,.footer p,.footer .muted{color:#9AA8AE!important}
footer .brand-mark,.footer .brand-mark{background:#17232A!important;border-color:#40515B!important}
footer .trace-rule{background:linear-gradient(90deg,#79B8B0,rgba(121,184,176,.12) 70%,transparent)!important}
.error{background:rgba(211,140,133,.09)!important;border-color:rgba(211,140,133,.4)!important;color:#E7A49E!important}
.toast{background:#E7ECEE!important;color:#10151B!important}
input,textarea,select{accent-color:#79B8B0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline-color:#79B8B0!important}
